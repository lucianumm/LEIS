name: Check official source freshness

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe official URLs
        run: python scripts/verify_sources.py --limit 100 --report source-verification.json
        continue-on-error: true
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-verification
          path: source-verification.json
